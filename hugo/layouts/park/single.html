{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    <div>{{ .Content }}</div>

    <!-- Navigation for Subpages -->
    <nav>
      <h2>Explore More About This Park Single</h2>
      <ul>
        {{ range .Pages }}
          <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </article>
{{ end }}
