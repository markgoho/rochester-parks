# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
  # Hours with a season or a date window resolve against the build date, so
  # the site rebuilds each day from the same content (ADR-0004).
  schedule:
    - cron: '0 9 * * *'
  # Approve, an owner Reply and delete dispatch this workflow through the
  # GitHub API, because a rebuild is the only way a Comment reaches a page
  # (ADR-0012).
  workflow_dispatch:
# Runs queue rather than race, so two approvals a minute apart both publish.
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Writes generated/comments.json. Any error fails the job: a build with
      # no file would take every Approved Comment off the live site.
      - run: bun scripts/fetch-comments.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROCHESTER_PARKS }}'
      - run: bun run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ROCHESTER_PARKS }}'
          channelId: live
          projectId: rochester-parks
