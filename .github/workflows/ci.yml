name: CI
on:
  pull_request:
jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --cwd functions
      - run: bun test
      # Neither the tests nor the Vite build check types.
      - run: bun run check
      - run: bunx tsc --noEmit -p functions
      - run: bun run --cwd functions lint
      # The reading-level checker runs as part of `bun run build`, so a Park
      # page that breaks the 8th-grade standard fails the PR, not the deploy.
      - run: bun run build
