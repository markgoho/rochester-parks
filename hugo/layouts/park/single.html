{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    <div>{{ .Content }}</div>

    <!-- Navigation for Subpages -->
    <nav>
      <nav>
        <h2>Explore More About This Park</h2>
        <ul>
          {{ range .Sections }} <!-- For branch bundles -->
            <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
          {{ end }}
        </ul>
      </nav>
      
  </article>
{{ end }}
