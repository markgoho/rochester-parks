{{ define "main" }}
  <nav class="park-list">
    <h2>Explore More About This Park</h2>
    <ul>
      {{ range .Pages }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  </nav>

  <article>
    <h1>{{ .Title }}</h1>
    <div>{{ .Content }}</div>
  </article>
{{ end }}

{{ define "footer-scripts" }}
  {{ partial "park-jsonld.html" . }}
{{ end }}
